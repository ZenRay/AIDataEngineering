# uv 项目脚手架 —— 实例化时：改 name/description、按需增删依赖，然后 `uv lock` 生成初始锁文件（CI `uv lock --check` 要求入库）
# 纪律（伞形 AGENTS.md 方案 D）：依赖变更一律走本文件 + uv lock；禁止在 .venv 手工 pip install（会被下次 uv sync 剪除）
[project]
name = "repo-name"            # 实例化时必改
version = "0.1.0"
description = "TODO: 一句话描述本 repo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# ── 语言基线（Python，data-warehouse 已验证；选型依据见 README「语言基线」节）──
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# ── 测试基线（硬约束；目录结构与规则见 README「测试基线」节）──
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
markers = [
    "unit: 模块内单元测试（无外部资源）",
    "integration: 跨模块或外部资源（DB/文件IO/网络）测试",
]
